<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulačka dovozu z Kanady</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red:#C8102E; --dark:#0f0f0f; --card:#1a1a1a; --card2:#222; --border:#2e2e2e; --text:#f0f0f0; --muted:#888; --gold:#e8b84b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dark); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:60px; }

  header { background:linear-gradient(135deg,#0f0f0f,#1a0a0a,#0f0f0f); border-bottom:2px solid var(--red); padding:24px 20px 18px; text-align:center; position:relative; overflow:hidden; }
  header::before { content:'🍁'; position:absolute; font-size:140px; opacity:0.04; top:-20px; left:50%; transform:translateX(-50%); pointer-events:none; }
  header h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(28px,6vw,50px); letter-spacing:3px; color:#fff; line-height:1; }
  header h1 span { color:var(--red); }
  header p { color:var(--muted); font-size:12px; margin-top:5px; letter-spacing:1px; text-transform:uppercase; }

  .lang-bar { background:#0d0d0d; border-bottom:1px solid var(--border); padding:8px 16px; display:flex; justify-content:flex-end; gap:6px; }
  .lang-btn { padding:5px 14px; background:none; border:1px solid var(--border); border-radius:6px; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .lang-btn.active { background:var(--red); border-color:var(--red); color:#fff; }

  .rates-bar {
    background: #111;
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    gap: 10px 16px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 11px;
    color: var(--muted);
  }
  .rates-bar .val { color: var(--gold); font-weight: 600; }
  .rate-item { display: flex; align-items: center; gap: 3px; white-space: nowrap; }

  .container { max-width:820px; margin:0 auto; padding:22px 14px; }

  .tabs { display:flex; background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:18px; }
  .tab-btn { flex:1; padding:13px; background:none; border:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:all 0.2s; }
  .tab-btn.active { background:var(--red); color:#fff; font-weight:600; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card-title { font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:2px; color:var(--red); margin-bottom:15px; }

  .field { margin-bottom:15px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:6px; font-weight:500; }
  input[type=number], select { width:100%; padding:12px 14px; background:var(--card2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none; transition:border-color 0.2s; -moz-appearance:textfield; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
  input[type=number]:focus, select:focus { border-color:var(--red); }
  select option { background:#222; }

  .type-sel { display:flex; gap:8px; }
  .type-btn { flex:1; padding:10px 8px; background:var(--card2); border:1.5px solid var(--border); border-radius:8px; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; transition:all 0.2s; text-align:center; }
  .type-btn.active { border-color:var(--red); color:#fff; background:rgba(200,16,46,0.12); }
  .type-btn .ico { font-size:20px; display:block; margin-bottom:3px; }

  .curr-toggle { display:flex; background:var(--card2); border:1px solid var(--border); border-radius:8px; overflow:hidden; width:fit-content; }
  .curr-btn { padding:8px 18px; background:none; border:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .curr-btn.active { background:var(--gold); color:#000; }

  .result-card { background:linear-gradient(135deg,#1a1a1a,#1e1010); border:1.5px solid var(--red); border-radius:12px; padding:20px; margin-bottom:14px; }
  .res-title { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; color:var(--muted); margin-bottom:14px; }
  .res-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; gap:10px; }
  .res-row:last-child { border-bottom:none; }
  .rn { color:var(--muted); }
  .rv { font-weight:600; color:var(--text); text-align:right; }
  .rv.gold { color:var(--gold); }
  .sub { font-size:11px; color:#555; font-weight:400; display:block; }

  .total-row { display:flex; justify-content:space-between; align-items:center; padding:15px 0 4px; margin-top:8px; border-top:2px solid var(--red); }
  .total-lbl { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#fff; }
  .total-val { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:1px; color:var(--red); }

  .note-box { background:rgba(232,184,75,0.07); border:1px solid rgba(232,184,75,0.2); border-radius:8px; padding:12px 14px; font-size:12px; color:#aaa; line-height:1.6; }
  .note-box strong { color:var(--gold); }

  .empty { text-align:center; color:var(--muted); padding:28px 16px; font-size:14px; }
  .empty .ico { font-size:36px; margin-bottom:10px; }
  .ship-note { font-size:11px; color:#555; margin-top:5px; }

  footer { text-align:center; color:#444; font-size:11px; margin-top:36px; padding:0 16px; }
</style>
</head>
<body>

<header>
  <h1 id="hTitle">DOVOZ AUT <span>Z KANADY</span></h1>
  <p id="hSub">Kalkulačka nákladů dovozu &mdash; Kanada &rarr; Evropa</p>
</header>

<div class="lang-bar">
  <button class="lang-btn active" id="btnLangCs" onclick="setLang('cs')">&#127464;&#127487; CZ</button>
  <button class="lang-btn"        id="btnLangPl" onclick="setLang('pl')">&#127477;&#127473; PL</button>
</div>

<div class="rates-bar">
  <div class="rate-item" id="rLabel">Kurzy:</div>
  <div class="rate-item">CAD/CZK:&nbsp;<span class="val" id="rCAD_CZK">...</span></div>
  <div class="rate-item">CAD/PLN:&nbsp;<span class="val" id="rCAD_PLN">...</span></div>
  <div class="rate-item">EUR/CZK:&nbsp;<span class="val" id="rEUR_CZK">...</span></div>
  <div class="rate-item">EUR/PLN:&nbsp;<span class="val" id="rEUR_PLN">...</span></div>
  <div class="rate-item">PLN/CZK:&nbsp;<span class="val" id="rPLN_CZK">...</span></div>
  <div class="rate-item" id="rSrc" style="color:#555;font-size:11px;"></div>
</div>

<div class="container">

  <div class="tabs">
    <button class="tab-btn active" id="tabA" onclick="setPersonType('fyzicka')">&#128100;&nbsp;<span id="tabALbl">Fyzická osoba</span></button>
    <button class="tab-btn"        id="tabB" onclick="setPersonType('firma')">&#127970;&nbsp;<span id="tabBLbl">Firma (bez DPH)</span></button>
  </div>

  <div class="card">
    <div class="card-title" id="cardTitle1">Parametry vozidla</div>

    <div class="field">
      <label id="lblType">Typ vozidla</label>
      <div class="type-sel">
        <button class="type-btn active" id="btnAuto" onclick="setVehicle('auto')">
          <span class="ico">&#128663;</span><span id="lblAutoTxt">Auto</span>
        </button>
        <button class="type-btn" id="btnMotor" onclick="setVehicle('motor')">
          <span class="ico">&#128693;</span><span id="lblMotorTxt">Motorka</span>
        </button>
      </div>
    </div>

    <div class="field">
      <label id="lblPrice">Cena vozidla na aukci (CAD)</label>
      <input type="number" id="carPrice" placeholder="15000" min="0" oninput="calculate()">
    </div>

    <div class="field">
      <label id="lblLoc">Místo aukce / odeslání</label>
      <select id="location" onchange="calculate()">
        <option value="" id="optDef">-- Vyberte město --</option>
        <option value="Montreal">Montreal</option>
        <option value="Halifax">Halifax</option>
        <option value="London">London (Ontario)</option>
        <option value="Toronto">Toronto</option>
        <option value="Quebec">Quebec</option>
        <option value="Ottawa">Ottawa</option>
        <option value="Vancouver">Vancouver</option>
        <option value="Winnipeg">Winnipeg</option>
        <option value="Calgary">Calgary / Edmonton</option>
        <option value="Moncton">Moncton</option>
      </select>
      <div class="ship-note" id="shipNote"></div>
    </div>
  </div>

  <div class="card" style="padding-bottom:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <div class="card-title" style="margin-bottom:0;" id="cardTitle2">Výsledek</div>
      <div class="curr-toggle">
        <button class="curr-btn active" onclick="setCurrency('CZK')">CZK</button>
        <button class="curr-btn"        onclick="setCurrency('PLN')">PLN</button>
      </div>
    </div>
    <div id="resultArea">
      <div class="empty"><div class="ico">&#127809;</div><div id="emptyMsg">Zadejte cenu vozidla a vyberte město</div></div>
    </div>
  </div>

</div>

<footer id="footerTxt">Kurzy se aktualizují při každém načtení stránky. Výsledky jsou orientační.</footer>

    noteFir:   'C\u0142o firmy to 10 % z ceny pojazdu + transport z Kanady (bez cz\u0119\u015bci holenderskiej, bez VAT).',
    noteEnd:   'Op\u0142ata za przelew bankowy 25 CAD nie jest uwzgl\u0119dniona. Ubezpieczenie 1 % jest opcjonalne.',
    shipNote:  'Transport z Kanady:',
    shipMoto:  'Transport motocykla z Kanady:',
    tier:      'tier',
    tierOf:    'wg warto\u015bci pojazdu',
    noMoto:    'Dla tej lokalizacji brak ceny transportu motocykla.',
    loading:   '\u0141adowanie kurs\u00f3w...',
  }
};

// ---- DATA ----
var SHIP_AUTO = {
  Montreal:[1800,1850,1900,1950], Halifax:[2045,2095,2145,2195],
  London:[2000,2050,2100,2150],   Toronto:[1900,1950,2000,2050],
  Quebec:[1975,2025,2075,2125],   Ottawa:[1900,1950,2000,2050],
  Vancouver:[3650,3700,3750,3800],Winnipeg:[2950,3000,3050,3100],
  Calgary:[3275,3325,3375,3425],  Moncton:[2225,2275,2325,2375]
};
var SHIP_MOTOR = {
  Montreal:1300,Halifax:1325,London:1350,Toronto:1300,
  Quebec:1375,Ottawa:1350,Vancouver:2125,Winnipeg:2000,
  Calgary:null,Moncton:null
};
var CLO_PTS = [[0,0],[2000,1000],[5000,1150],[10000,1500],[15000,1750],[20000,2000],[25000,2200]];
var PROVIZE_PLN = 1500;
var HOLAND_PLN  = 2300;
var FALLBACK    = {CAD_CZK:17.05, CAD_PLN:2.98, EUR_CZK:25.10, EUR_PLN:4.39};

// ---- STATE ----
var rates      = null;
var personType = 'fyzicka';
var vehicleType= 'auto';
var currency   = 'CZK';
var lang       = 'cs';

// ---- LANG ----
function setLang(l) {
  lang = l;
  document.getElementById('btnLangCs').classList.toggle('active', l === 'cs');
  document.getElementById('btnLangPl').classList.toggle('active', l === 'pl');
  renderStatic();
  calculate();
}

function renderStatic() {
  var t = TX[lang];
  document.getElementById('hTitle').innerHTML    = t.hTitle;
  document.getElementById('hSub').textContent    = t.hSub;
  document.getElementById('rLabel').textContent  = t.rLabel;
  document.getElementById('tabALbl').textContent = t.tabA;
  document.getElementById('tabBLbl').textContent = t.tabB;
  document.getElementById('cardTitle1').textContent = t.card1;
  document.getElementById('cardTitle2').textContent = t.card2;
  document.getElementById('lblType').textContent    = t.lblType;
  document.getElementById('lblAutoTxt').textContent = t.lblAuto;
  document.getElementById('lblMotorTxt').textContent= t.lblMotor;
  document.getElementById('lblPrice').textContent   = t.lblPrice;
  document.getElementById('lblLoc').textContent     = t.lblLoc;
  document.getElementById('optDef').textContent     = t.optDef;
  document.getElementById('footerTxt').textContent  = t.footer;
}

// ---- RATES ----
function withTimeout(p, ms) {
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej('timeout'); }, ms); })]);
}

function tryFrankfurter() {
  return Promise.all([
    fetch('https://api.frankfurter.app/latest?from=CAD&to=CZK,PLN').then(function(r){ return r.json(); }),
    fetch('https://api.frankfurter.app/latest?from=EUR&to=CZK,PLN').then(function(r){ return r.json(); })
  ]).then(function(res) {
    var d1 = res[0], d2 = res[1];
    if (!d1.rates || !d2.rates) throw new Error('bad');
    return {CAD_CZK:d1.rates.CZK, CAD_PLN:d1.rates.PLN, EUR_CZK:d2.rates.CZK, EUR_PLN:d2.rates.PLN};
  });
}

function tryOpenER() {
  return Promise.all([
    fetch('https://open.er-api.com/v6/latest/CAD').then(function(r){ return r.json(); }),
    fetch('https://open.er-api.com/v6/latest/EUR').then(function(r){ return r.json(); })
  ]).then(function(res) {
    var d1 = res[0], d2 = res[1];
    if (!d1.rates || !d2.rates) throw new Error('bad');
    return {CAD_CZK:d1.rates.CZK, CAD_PLN:d1.rates.PLN, EUR_CZK:d2.rates.CZK, EUR_PLN:d2.rates.PLN};
  });
}

function fetchRates() {
  withTimeout(tryFrankfurter(), 5000)
    .catch(function() { return withTimeout(tryOpenER(), 5000); })
    .catch(function() { return Object.assign({}, FALLBACK); })
    .then(function(r) {
      rates = r;
      document.getElementById('rCAD_CZK').textContent = r.CAD_CZK.toFixed(3);
      document.getElementById('rCAD_PLN').textContent = r.CAD_PLN.toFixed(3);
      document.getElementById('rEUR_CZK').textContent = r.EUR_CZK.toFixed(3);
      document.getElementById('rEUR_PLN').textContent = r.EUR_PLN.toFixed(3);
      document.getElementById('rPLN_CZK').textContent = (r.CAD_CZK / r.CAD_PLN).toFixed(3);
      document.getElementById('rSrc').textContent = new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
      calculate();
    });
}

// ---- HELPERS ----
function tier(cad) {
  if (cad < 5000)  return 0;
  if (cad < 10000) return 1;
  if (cad < 20000) return 2;
  return 3;
}

function cloFyz(cad) {
  var pts = CLO_PTS;
  if (cad <= 0) return 0;
  // linearni interpolace do 25000
  for (var i = 0; i < pts.length - 1; i++) {
    if (cad <= pts[i+1][0]) {
      var t = (cad - pts[i][0]) / (pts[i+1][0] - pts[i][0]);
      return pts[i][1] + t * (pts[i+1][1] - pts[i][1]);
    }
  }
  // nad 25000 CAD: mocninna funkce fitovana na cela data (2000->1000, 25000->2200)
  // clo = 1000 * (cad/2000)^k, kde k = log(2200/1000)/log(25000/2000) = ~0.3438
  var k = Math.log(2200 / 1000) / Math.log(25000 / 2000);
  return 1000 * Math.pow(cad / 2000, k);
}

function c2l(v) { return currency==='CZK' ? v*rates.CAD_CZK : v*rates.CAD_PLN; }
function e2l(v) { return currency==='CZK' ? v*rates.EUR_CZK : v*rates.EUR_PLN; }
function p2l(v) { return currency==='PLN' ? v : v*(rates.CAD_CZK/rates.CAD_PLN); }
function c2e(v) { return v*(rates.CAD_CZK/rates.EUR_CZK); }

function fV(v)   { return currency==='CZK' ? v.toLocaleString('cs-CZ',{maximumFractionDigits:0})+'\u00a0K\u010d' : v.toLocaleString('pl-PL',{maximumFractionDigits:0})+'\u00a0z\u0142'; }
function fC(v)   { return v.toLocaleString('en-CA',{maximumFractionDigits:0})+'\u00a0CAD'; }
function fE(v)   { return v.toLocaleString('cs-CZ',{maximumFractionDigits:0})+'\u00a0EUR'; }
function fP(v)   { return v.toLocaleString('pl-PL',{maximumFractionDigits:0})+'\u00a0z\u0142'; }

// ---- CONTROLS ----
function setPersonType(p) {
  personType = p;
  document.getElementById('tabA').classList.toggle('active', p==='fyzicka');
  document.getElementById('tabB').classList.toggle('active', p==='firma');
  calculate();
}

function setVehicle(v) {
  vehicleType = v;
  document.getElementById('btnAuto').classList.toggle('active', v==='auto');
  document.getElementById('btnMotor').classList.toggle('active', v==='motor');
  document.getElementById('location').value = '';
  document.getElementById('shipNote').textContent = '';
  calculate();
}

function setCurrency(c) {
  currency = c;
  document.querySelectorAll('.curr-btn').forEach(function(b){ b.classList.toggle('active', b.textContent===c); });
  calculate();
}

// ---- CALCULATE ----
function calculate() {
  var t   = TX[lang];
  var priceStr = document.getElementById('carPrice').value;
  var loc      = document.getElementById('location').value;
  var noteEl   = document.getElementById('shipNote');
  var resEl    = document.getElementById('resultArea');

  if (!priceStr || !loc) {
    resEl.innerHTML = '<div class="empty"><div class="ico">&#127809;</div><div>' + t.emptyMsg + '</div></div>';
    noteEl.textContent = '';
    return;
  }
  if (!rates) {
    resEl.innerHTML = '<div class="empty">' + t.loading + '</div>';
    return;
  }

  var carCAD = parseFloat(priceStr);
  if (isNaN(carCAD) || carCAD < 0) return;

  // DOPRAVA Z KANADY
  var shipCAD = 0;
  if (vehicleType === 'motor') {
    var mv = SHIP_MOTOR[loc];
    if (mv === null) {
      resEl.innerHTML = '<div class="empty">' + t.noMoto + '</div>';
      noteEl.textContent = '';
      return;
    }
    shipCAD = mv;
    noteEl.textContent = t.shipMoto + ' ' + fC(shipCAD);
  } else {
    var tr = tier(carCAD);
    shipCAD = SHIP_AUTO[loc][tr];
    noteEl.textContent = t.shipNote + ' ' + fC(shipCAD) + ' (' + t.tier + ' ' + (tr+1) + '/4, ' + t.tierOf + ')';
  }

  var shipCAlocal = c2l(shipCAD);
  var shipNLlocal = p2l(HOLAND_PLN);

  // CLO
  var cloEUR, cloLbl, cloSub;
  if (personType === 'fyzicka') {
    cloEUR = cloFyz(carCAD);
    cloLbl = t.rowCloFyz;
    cloSub = t.subCloFyz;
  } else {
    cloEUR = c2e(carCAD + shipCAD) * 0.10;
    cloLbl = t.rowCloFir;
    cloSub = t.subCloFir;
  }

  var cloLocal   = e2l(cloEUR);
  var provLocal  = p2l(PROVIZE_PLN);
  var carLocal   = c2l(carCAD);
  var total      = carLocal + shipCAlocal + cloLocal + shipNLlocal + provLocal;

  resEl.innerHTML =
    '<div class="result-card">' +
      '<div class="res-title">' + t.resTitle + '</div>' +

      '<div class="res-row">' +
        '<span class="rn">&#128663; ' + t.rowCar + '</span>' +
        '<span class="rv">' + fC(carCAD) + '<span class="sub">= ' + fV(Math.round(carLocal)) + '</span></span>' +
      '</div>' +

      '<div class="res-row">' +
        '<span class="rn">&#128674; ' + t.rowShipCA + '<span class="sub">' + loc + '</span></span>' +
        '<span class="rv">' + fC(shipCAD) + '<span class="sub">= ' + fV(Math.round(shipCAlocal)) + '</span></span>' +
      '</div>' +

      '<div class="res-row">' +
        '<span class="rn">&#128203; ' + cloLbl + '<span class="sub">' + cloSub + '</span></span>' +
        '<span class="rv gold">' + fE(Math.round(cloEUR)) + '<span class="sub">= ' + fV(Math.round(cloLocal)) + '</span></span>' +
      '</div>' +

      '<div class="res-row">' +
        '<span class="rn">&#128674; ' + t.rowShipNL + '</span>' +
        '<span class="rv">' + fP(HOLAND_PLN) + '<span class="sub">= ' + fV(Math.round(shipNLlocal)) + '</span></span>' +
      '</div>' +

      '<div class="res-row">' +
        '<span class="rn">&#128188; ' + t.rowProv + '<span class="sub">' + t.subProv + '</span></span>' +
        '<span class="rv">' + fP(PROVIZE_PLN) + '<span class="sub">= ' + fV(Math.round(provLocal)) + '</span></span>' +
      '</div>' +

      '<div class="total-row">' +
        '<span class="total-lbl">' + t.totalLbl + '</span>' +
        '<span class="total-val">' + fV(Math.round(total)) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="note-box"><strong>' + t.noteHead + '</strong> ' + t.noteBase + ' ' +
      (personType==='fyzicka' ? t.noteFyz : t.noteFir) + ' ' + t.noteEnd +
    '</div>';
}

// ---- INIT ----
renderStatic();
fetchRates();
</script>
</body>
</html>
